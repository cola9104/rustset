services:
  postgres:
    image: postgres:18
    container_name: rustset-postgres
    environment:
      POSTGRES_USER: rustset
      POSTGRES_PASSWORD: rustset
      POSTGRES_DB: rustset
    ports:
      - "5432:5432"
    volumes:
      - rustset-postgres:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: rustset-redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2
    container_name: rustset-nats
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    # minio/minio was removed from Docker Hub (2026-09); bitnamilegacy keeps the
    # last free images. Data dir is /bitnami/minio/data and ports default to 9000/9001.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: rustset-minio
    environment:
      MINIO_ROOT_USER: rustset
      MINIO_ROOT_PASSWORD: rustset_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustset-minio:/bitnami/minio/data

volumes:
  rustset-postgres:
  rustset-minio:
