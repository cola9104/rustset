<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RustSet - 安全资产管理平台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 加载动画 */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #loading::after {
            content: "";
            display: block;
            width: 40px;
            height: 40px;
            margin-top: 10px;
            border-radius: 50%;
            border: 3px solid #ccc;
            border-top-color: #3b82f6;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="loading">正在加载 RustSet...</div>
    </div>
</body>
</html>
