<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RustSet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Basic loading spinner */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #333;
        }

        /* Sidebar menu hover styles */
        .menu-list a:hover {
            background-color: #e8e8e8 !important;
            color: #3273dc !important;
        }

        .menu-list a.is-active {
            background-color: #3273dc !important;
            color: #ffffff !important;
        }

        /* Excel-like table styles */
        .excel-table-wrapper {
            overflow-x: auto;
            position: relative;
            border: 1px solid #ddd;
        }

        .excel-table {
            border-collapse: collapse;
            width: 100%;
            min-width: 3200px;
        }

        .excel-table td,
        .excel-table th {
            min-height: 48px;
        }

        .excel-table thead tr {
            background: #f5f5f5;
        }

        .excel-table th {
            border: 1px solid #ddd;
            padding: 16px 10px;
            font-weight: bold;
            text-align: left;
            position: relative;
            user-select: none;
            font-size: 14px;
        }

        .excel-table td {
            border: 1px solid #ddd;
            padding: 16px 10px;
            font-size: 14px;
            line-height: 1.6;
        }

        .excel-table tbody tr.excel-row:hover {
            background-color: #e8f4fd !important;
        }

        .resizer {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 5px;
            cursor: col-resize;
            user-select: none;
        }

        .resizer:hover,
        .resizer.resizing {
            background: #3273dc;
        }

        /* Action select styling */
        .action-select {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
        }

        .action-select:focus {
            outline: none;
            border-color: #3273dc;
            box-shadow: 0 0 0 2px rgba(50, 115, 220, 0.2);
        }
    </style>
</head>
<body>
    <div id="main"></div>
    <script type="module">
        import init from './pkg/frontend.js';
        init('/pkg/frontend_bg.wasm');
    </script>
    <script>
        // Column resize functionality for Excel-like table
        document.addEventListener('DOMContentLoaded', function() {
            const table = document.querySelector('.excel-table');
            if (!table) return;

            let currentResizer = null;
            let currentTh = null;
            let startX = 0;
            let startWidth = 0;

            table.querySelectorAll('.resizer').forEach(resizer => {
                resizer.addEventListener('mousedown', function(e) {
                    currentTh = e.target.parentElement;
                    startX = e.pageX;
                    startWidth = currentTh.offsetWidth;
                    currentResizer = e.target;
                    currentResizer.classList.add('resizing');

                    document.addEventListener('mousemove', handleMouseMove);
                    document.addEventListener('mouseup', handleMouseUp);
                    e.preventDefault();
                });
            });

            function handleMouseMove(e) {
                if (currentTh) {
                    const width = startWidth + (e.pageX - startX);
                    const minWidth = 60;
                    const finalWidth = Math.max(width, minWidth);

                    currentTh.style.minWidth = finalWidth + 'px';
                    currentTh.style.maxWidth = finalWidth + 'px';
                    currentTh.style.width = finalWidth + 'px';

                    // Update all cells in this column
                    const colIndex = Array.from(currentTh.parentElement.children).indexOf(currentTh);
                    table.querySelectorAll('tbody tr').forEach(row => {
                        const cell = row.children[colIndex];
                        if (cell) {
                            cell.style.minWidth = finalWidth + 'px';
                            cell.style.maxWidth = finalWidth + 'px';
                            cell.style.width = finalWidth + 'px';
                        }
                    });
                }
            }

            function handleMouseUp() {
                if (currentResizer) {
                    currentResizer.classList.remove('resizing');
                }
                currentResizer = null;
                currentTh = null;
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleMouseUp);
            }
        });
    </script>
</body>
</html>
