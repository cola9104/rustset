[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Dioxus framework with web and router support
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-web = "0.7"
dioxus-router = "0.7"

# Icon library - dioxus-free-icons with Font Awesome icons
dioxus-free-icons = { version = "0.10", features = ["font-awesome-solid"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Shared types
shared = { path = "../shared" }

# HTTP client
gloo-net = { version = "0.6", features = ["http"] }

# WASM support
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Navigator"] }

# Logging
console_error_panic_hook = "0.1"
tracing = "0.1"
tracing-wasm = "0.2"

# UUID for generating unique IDs
uuid = { version = "1.0", features = ["v4", "js"] }
