[package]
name = "frontend"
version = "0.1.0"
edition = "2021"


[dependencies]
# Yew web framework - updated to 0.22 for Rust 1.90+
yew = { version = "0.22", default-features = false, features = ["csr"] }

# Tokio without net features for wasm32 compatibility
tokio = { version = "1", default-features = false, features = ["sync", "rt", "time", "macros", "io-util"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = "0.4"

# Shared types
shared = { path = "../shared" }

# Logging
gloo-console = "0.3"
console_error_panic_hook = "0.1"

# HTTP client - updated for Yew 0.22 compatibility
gloo-net = { version = "0.6", features = ["http"] }

# WASM support - updated versions for Yew 0.22
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "HtmlInputElement", "HtmlSelectElement", "InputEvent", "Event", "Navigator", "Clipboard", "Blob", "BlobPropertyBag", "Url", "Document", "HtmlElement", "console"] }

# Utils - updated versions
gloo-utils = "0.2"
gloo-timers = "0.3"

# Getrandom with js feature for WASM
getrandom = { version = "0.2", features = ["js"] }
