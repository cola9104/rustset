[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "backend"
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# SeaORM dependencies
sea-orm = { version = "2.0.0-rc.36", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-mysql", "macros", "with-chrono", "with-uuid", "with-json"] }
sea-orm-migration = { version = "2.0.0-rc.36", features = ["sqlx-postgres"] }
chrono = "0.4"
shared = { path = "../shared" }
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
ipnetwork = "0.21"
lazy_static = "1.5"
async-trait = "0.1"
regex = "1.11"
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
# Password hashing
argon2 = "0.5"
password-hash = "0.5"
thiserror = "1.0"
# OpenAPI/Swagger
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
# utoipa-swagger-ui = { version = "9", features = ["axum"] }  # 暂时禁用 - 网络问题
