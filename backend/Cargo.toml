[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# SeaORM dependencies
sea-orm = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "macros", "with-chrono", "with-uuid", "with-json"] }
sea-orm-migration = "1.1"
chrono = "0.4"
shared = { path = "../shared" }
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
ipnetwork = "0.21"
lazy_static = "1.5"
async-trait = "0.1"
regex = "1.11"
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
