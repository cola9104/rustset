[package]
name = "rustset-web-dioxus"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
dioxus-web = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = { version = "0.6", features = ["http"] }
web-sys = { version = "0.3", features = ["Headers","ReadableStream","Request","RequestInit","RequestMode","Response","Window","Storage"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
log = "0.4"
console_log = "0.2"
