<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RustSet - 资产管理平台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234f46e5'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-weight='bold'>R</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' },
            sidebar: { bg: '#001529', hover: '#1677ff', text: '#ffffffb3', active: '#ffffff' }
          }
        }
      }
    }
  </script>
  <style>
    :root { --primary: #4f46e5; --sidebar-width: 240px; --header-height: 56px; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #1f2937; background: #f5f5f5; }
    .ant-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .ant-table th { background: #fafafa; padding: 12px 16px; text-align: left; font-weight: 600; font-size: 13px; color: #6b7280; border-bottom: 1px solid #f0f0f0; }
    .ant-table td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
    .ant-table tr:hover td { background: #fafafa; }
    .ant-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid #d1d5db; background: white; color: #374151; transition: all .2s; }
    .ant-btn:hover { border-color: var(--primary); color: var(--primary); }
    .ant-btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
    .ant-btn-primary:hover { background: #4338ca; }
    .ant-btn-danger { color: #ef4444; border-color: #fca5a5; }
    .ant-btn-danger:hover { background: #fef2f2; }
    .ant-input { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; width: 100%; transition: border-color .2s; }
    .ant-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(79,70,229,.15); }
    .ant-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .ant-modal { background: white; border-radius: 8px; padding: 24px; min-width: 520px; max-width: 90vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 6px 30px rgba(0,0,0,.15); }
    .ant-modal-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
    .ant-form-item { margin-bottom: 16px; }
    .ant-form-label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    .ant-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
    .ant-tag-blue { background: #eff6ff; color: #3b82f6; }
    .ant-tag-green { background: #f0fdf4; color: #22c55e; }
    .ant-tag-red { background: #fef2f2; color: #ef4444; }
    .ant-tag-orange { background: #fff7ed; color: #f97316; }
    .ant-tag-purple { background: #faf5ff; color: #a855f7; }
    .ant-pagination { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 16px; }
    .ant-pagination button { padding: 4px 12px; border: 1px solid #d1d5db; border-radius: 4px; background: white; cursor: pointer; }
    .ant-pagination button.active { background: var(--primary); color: white; border-color: var(--primary); }
    /* ── Tree ── */
    .ant-tree { font-size: 14px; }
    .ant-tree-node { display: flex; align-items: center; padding: 2px 0; cursor: pointer; border-radius: 4px; margin: 1px 0; transition: background .15s; }
    .ant-tree-node:hover { background: #f5f5f5; }
    .ant-tree-node-selected { background: #e6f4ff !important; }
    .ant-tree-node-selected .ant-tree-title { color: #1677ff; }
    .ant-tree-indent { display: inline-block; width: 24px; height: 100%; flex-shrink: 0; }
    .ant-tree-switcher { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0; border-radius: 2px; }
    .ant-tree-switcher-has-children { cursor: pointer; }
    .ant-tree-switcher-icon { font-size: 10px; color: #999; transition: transform .2s; user-select: none; }
    .ant-tree-node-icon { display: inline-flex; align-items: center; width: 20px; height: 24px; flex-shrink: 0; font-size: 13px; }
    .ant-tree-title { padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body><div id="main"></div></body>
</html>
